# Sub-projects declared with their own `[project]` table are standalone cmkr roots:

# They keep a bootstrap block, can be configured on their own, and are regenerated by
# the root project too. The root project also registers their `cmake.toml` as a
# configure-time dependency, so editing one triggers a full regeneration.

[project]
name = "subdir-projects"

[subdir.Sub]
