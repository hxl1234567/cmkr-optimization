# A subdirectory with its own `[project]` table: generated as a standalone cmkr root
# and still regenerated by the root project. The `ENABLE_ROOT_OPT` option is declared
# in the root project and is visible here through the seeded condition table.

[project]
name = "sub-project"
description = "Standalone root project nested in a subdirectory"

[target.sub]
type = "executable"
sources = ["main.cpp"]
ENABLE_ROOT_OPT.compile-definitions = ["FROM_ROOT_OPTION"]
